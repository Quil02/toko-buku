[project]
name = "toko-buku"
version = "1.0.0"
description = "Aplikasi toko buku online dengan FastAPI dan JavaScript"
readme = "README.md"
authors = [
    { name = "Fulanu", email = "fulanu56@gmail.com" }
]
requires-python = ">=3.12"
