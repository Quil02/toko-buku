<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Toko Buku Online</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        📚 <span>TokoBuku</span>
      </a>
      <div class="navbar-user">
        <button id="darkModeToggle" class="btn-dark-toggle" title="Ganti ke Mode Gelap" aria-label="Ganti ke Mode Gelap">🌙</button>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2 class="auth-title">Buat Akun Baru</h2>
        <p class="auth-subtitle">Daftarkan akun untuk mulai berbelanja buku</p>
      </div>

      <div id="authAlert" class="alert hidden" role="alert"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="fullName" class="form-label">Nama Lengkap</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            class="form-control" 
            placeholder="Nama lengkap Anda" 
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Alamat Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="nama@email.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Kata Sandi</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Minimal 6 karakter" 
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Konfirmasi Kata Sandi</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            class="form-control" 
            placeholder="Ulangi kata sandi Anda" 
            required
            autocomplete="new-password"
          >
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Daftar Akun</button>
      </form>


      <div class="auth-divider">
        <span>atau</span>
      </div>

      <button type="button" id="guestBtn" class="btn btn-guest btn-block">
        Lanjut sebagai Tamu
      </button>

      <div class="auth-footer">
        <p>Sudah punya akun? <a href="login.html" class="auth-link">Masuk di sini</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/pages/register.js"></script>
  <script type="module" src="js/utils/darkMode.js"></script>
</body>
</html>
