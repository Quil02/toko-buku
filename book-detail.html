<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Buku - Toko Buku Online</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        📚 <span>TokoBuku</span>
      </a>

      <nav class="navbar-nav">
        <a href="index.html" class="nav-link">Katalog</a>
      </nav>

      <button id="darkModeToggle" class="btn-dark-toggle" title="Ganti ke Mode Gelap" aria-label="Ganti ke Mode Gelap">🌙</button>
      <div class="navbar-user" id="authNavContainer">        <a href="login.html" class="btn btn-outline">Masuk</a>
        <a href="register.html" class="btn btn-primary">Daftar</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container detail-container">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html">Katalog</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current" id="breadcrumbTitle">Memuat Buku...</span>
      </nav>

      <!-- Book Detail Container -->
      <div id="bookDetailWrapper" class="book-detail-wrapper">
        <div class="catalog-state">
          <div class="catalog-state-icon">🔄</div>
          <h3 class="catalog-state-title">Memuat Detail Buku...</h3>
          <p class="catalog-state-desc">Mengambil informasi buku dari Google Books API.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2025 TokoBuku Online. Menggunakan data Google Books API.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/pages/bookDetail.js"></script>
  <script type="module" src="js/utils/darkMode.js"></script>
</body>
</html>
