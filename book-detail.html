<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Buku - Toko Buku Online</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        📚 <span>TokoBuku</span>
      </a>

      <nav class="navbar-nav">
        <a href="index.html" class="nav-link">Katalog</a>
      </nav>

      <button id="darkModeToggle" class="btn-dark-toggle" title="Ganti ke Mode Gelap" aria-label="Ganti ke Mode Gelap">🌙</button>
      <div class="navbar-user" id="authNavContainer">        <a href="login.html" class="btn btn-outline">Masuk</a>
        <a href="register.html" class="btn btn-primary">Daftar</a>
      </div>
      <button class="navbar-hamburger" id="navHamburger" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <nav class="navbar-mobile-drawer" id="mobileDrawer" aria-label="Menu Mobile"></nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container detail-container">
      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html">Katalog</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current" id="breadcrumbTitle">Memuat Buku...</span>
      </nav>

      <!-- Book Detail Container -->
      <div id="bookDetailWrapper" class="book-detail-wrapper">
        <div class="book-detail-skeleton" aria-hidden="true">
          <div class="skeleton sk-cover-wrap"></div>
          <div class="sk-info">
            <div class="skeleton sk-badge"></div>
            <div class="skeleton sk-title"></div>
            <div class="skeleton sk-title-2"></div>
            <div class="skeleton sk-author"></div>
            <div class="skeleton sk-price"></div>
            <div class="skeleton sk-desc"></div>
            <div class="skeleton sk-desc-2"></div>
            <div class="skeleton sk-desc-3"></div>
            <div class="sk-actions">
              <div class="skeleton sk-action-btn"></div>
              <div class="skeleton sk-action-btn"></div>
              <div class="skeleton sk-action-btn"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2025 TokoBuku Online. Menggunakan data Open Library.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/pages/bookDetail.js"></script>
  <script type="module" src="js/utils/darkMode.js"></script>
</body>
</html>
