<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Buku - BookStore</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <span>BookStore</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Katalog</a>
      </nav>

      <div class="auth-buttons" id="authNavContainer">
        <a href="login.html" class="btn btn-outline" id="navLoginBtn">Masuk</a>
        <a href="register.html" class="btn btn-primary" id="navRegisterBtn">Daftar</a>
      </div>
    </div>
  </header>

  <!-- Book Detail Container -->
  <main class="container detail-container">
    <div class="breadcrumb">
      <a href="index.html">Katalog</a>
      <span>/</span>
      <span id="breadcrumbTitle">Memuat Buku...</span>
    </div>

    <div id="bookDetailWrapper">
      <!-- Loading State Default -->
      <div class="catalog-state">
        <div class="catalog-state-icon">⏳</div>
        <h3 class="catalog-state-title">Memuat Detail Buku...</h3>
        <p class="catalog-state-desc">Mengambil informasi terbaru dari Google Books API.</p>
      </div>
    </div>

    <!-- Reviews Section -->
    <section class="reviews-section" id="reviewsSection" style="display: none;">
      <div class="reviews-header">
        <h3>Ulasan & Penilaian Pembaca</h3>
      </div>

      <!-- Review Form -->
      <div class="review-form-container">
        <h4 class="review-form-title">Tulis Ulasan Anda</h4>
        <form id="reviewForm">
          <div class="form-group">
            <label class="form-label">Beri Rating Bintang</label>
            <div class="star-rating-input" id="starRatingInput">
              <span class="star" data-val="1">★</span>
              <span class="star" data-val="2">★</span>
              <span class="star" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star active" data-val="5">★</span>
            </div>
            <input type="hidden" id="ratingValue" value="5">
          </div>

          <div class="form-group">
            <label for="reviewUserName" class="form-label">Nama Anda</label>
            <input type="text" id="reviewUserName" class="form-control" placeholder="Nama lengkap Anda" required>
          </div>

          <div class="form-group">
            <label for="reviewComment" class="form-label">Komentar / Pengalaman Membaca</label>
            <textarea id="reviewComment" class="form-control" rows="3" placeholder="Ceritakan pendapat Anda tentang buku ini..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" id="submitReviewBtn">Kirim Ulasan</button>
        </form>
      </div>

      <!-- Reviews List Container -->
      <div class="reviews-list" id="reviewsList">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2025 BookStore App. Data didukung langsung oleh Google Books API.</p>
    </div>
  </footer>

  <script type="module" src="js/pages/bookDetail.js"></script>
</body>
</html>
