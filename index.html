<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Buku Online - Temukan Buku Favoritmu</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <span>BookStore</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link active">Katalog</a>
      </nav>

      <div class="auth-buttons" id="authNavContainer">
        <!-- Dynamic via auth status -->
        <a href="login.html" class="btn btn-outline" id="navLoginBtn">Masuk</a>
        <a href="register.html" class="btn btn-primary" id="navRegisterBtn">Daftar</a>
      </div>
    </div>
  </header>

  <!-- Main Catalog Content -->
  <main class="container catalog-container">
    <!-- Filter Sidebar -->
    <aside class="catalog-sidebar">
      <div class="filter-section">
        <div class="filter-title">
          <span>Kategori Populer</span>
        </div>
        <div class="filter-options" id="categoryFilterGroup">
          <label class="filter-option">
            <input type="radio" name="category" value="" checked>
            <span>Semua Kategori</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Computers">
            <span>Computers & Tech</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Fiction">
            <span>Fiction & Novel</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Business">
            <span>Business & Finance</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="Science">
            <span>Science & Nature</span>
          </label>
          <label class="filter-option">
            <input type="radio" name="category" value="History">
            <span>History</span>
          </label>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">
          <span>Rentang Harga (Rp)</span>
        </div>
        <div class="price-range-inputs">
          <div class="price-input-group">
            <input type="number" id="minPriceInput" placeholder="Min (cth. 50.000)" min="0" step="5000">
          </div>
          <div class="price-input-group">
            <input type="number" id="maxPriceInput" placeholder="Maks (cth. 200.000)" min="0" step="5000">
          </div>
          <button type="button" class="btn btn-primary btn-filter-apply" id="applyPriceFilterBtn">Terapkan Filter</button>
          <button type="button" class="btn-filter-reset" id="resetFilterBtn">Reset Semua Filter</button>
        </div>
      </div>
    </aside>

    <!-- Catalog Main Area -->
    <section class="catalog-content">
      <!-- Toolbar: Search Bar & Sorting -->
      <div class="catalog-toolbar">
        <div class="search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Cari judul buku, penulis, atau kata kunci...">
        </div>

        <div class="sort-wrapper">
          <label for="sortSelect" class="sort-label">Urutkan:</label>
          <select id="sortSelect" class="sort-select">
            <option value="default">Relevansi</option>
            <option value="price-asc">Harga: Termurah</option>
            <option value="price-desc">Harga: Termahal</option>
            <option value="rating-desc">Rating Tertinggi</option>
            <option value="title-asc">Judul (A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Books Grid Container -->
      <div class="books-grid" id="booksGrid">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2025 BookStore App. Data didukung langsung oleh Google Books API.</p>
    </div>
  </footer>

  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
